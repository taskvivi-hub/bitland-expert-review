<script id="data" type="application/json">{"1": {"meta": {"zh": "網路村", "topic": "網際網路與物聯網", "purpose": "試玩單元", "extend": "將分散式網路與物聯網知識轉化為網路修復、村民需求調查與有限預算下的物聯網計畫優先排序。", "learning": "能說明網路與物聯網的主要概念；比較不同 IoT 方案的效益與限制；以證據支持選擇並回應反方問題。", "taskzh": "寫一篇 120–150 字的英文論證短文，說明哪一項物聯網計畫最能幫助村莊，提出至少兩項理由、相關證據、推理與反方回應。", "scene": "村莊需要修復網路，而且只有一筆經費可支持一項物聯網計畫。學生協助村民、蒐集資料，最後向村長說明建議。", "question": "哪一項物聯網計畫對村子最有幫助？"}, "readings": [{"title": "The Origin of the Internet", "english": ["Today, the internet is something that most people take for granted. However, the reasons for its origin might surprise you. Rather than being created for all of the things we use it for now, it was invented1 because of national security2 in the United States during the Cold War. The idea was to provide a secure way for the US armed forces to communicate3 in case of a nuclear war.\nBack in the 1950s, computers were very large, expensive machines. Their size alone made it necessary for buildings to have separate rooms to store them in! Because of this, there weren’t many computers available for people to use, and those who needed them often had to travel long distances to use them.", "Around 1964, an engineer named Paul Baran came up with an idea to create a network4 where computers could communicate with each other. However, his idea was unique5 in that there would be no central point in the network. All of the computers could communicate with any other computer on the network. If any one computer was taken out in a nuclear strike, it would not affect the others’ ability to communicate.\nIn 1965, two computers in different locations were able to communicate with each other for the first time. Jump ahead thirty years to 1995, and the internet revolution6 was already taking place. We now use the internet for practically everything!"], "chinese": ["現在，多數人都把網際網路視為理所當然的事物，但它的起源可能出乎意料。網際網路最初並非為今日各種用途而發明，而是在冷戰期間，為了美國國家安全而發展，目的是在核戰發生時提供軍方安全的通訊方式。1950 年代的電腦體積龐大、價格昂貴，甚至需要獨立房間放置。因此電腦數量很少，有需求的人經常必須長途跋涉才能使用。", "約在 1964 年，工程師 Paul Baran 提出讓電腦彼此通訊的網路構想。特別之處是網路不設單一中心，任何電腦都能與網路中的其他電腦通訊。即使有一台電腦在核攻擊中遭摧毀，其他電腦仍能保持通訊。1965 年，兩台位於不同地點的電腦首次成功通訊。三十年後的 1995 年，網際網路革命已經展開；如今網路幾乎用於生活中的所有事情。"], "page": 10}, {"title": "The Internet of Things", "english": ["We use our smartphones to communicate with our friends and family, play games, get information, and even shop online7. While these pocket-sized devices8 keep us connected, we are also surrounded by other devices that are also connected to the world and are constantly monitoring9 it. All these devices are collectively10 known as the internet of things (IoT).\nWhat are these IoT devices? Some of them are not widely known about or even noticed, such as implants that monitor people with heart problems and special devices that keep track of animals on farms. Others are right in front of us every day, from smart watches to many of the electric cars on the road.\nThe way these devices work is through the use of sensors11. Just as we can hear and see as we move about the world, these devices can also detect temperature, actions, locations, and even images. As they take in information, they share that data in real time. Most of the time, this is done without any input from people.", "How does this benefit people directly? Well, smart sensors in our homes allow things to be to be run very efficiently12 so that energy isn’t wasted. For example, home heating or air conditioning can be turned off automatically when we leave, and then turned back on before we arrive home from work. If you forget where you parked your car, the IoT can help you find it. And if the milk in your refrigerator runs low, it can even order bottles of milk for you.\nAs the IoT continues to expand, we will likely begin to see it almost everywhere. It can benefit farmers by monitoring their crop’s growth, and it can also benefit the planet by reducing energy consumption."], "chinese": ["我們用智慧型手機與親友聯絡、玩遊戲、查資訊和網購。但除了手機，生活周遭還有許多連上網路並持續監測環境的裝置，這些裝置合稱物聯網（IoT）。物聯網裝置有些不容易被注意到，例如監測心臟問題的植入裝置、追蹤農場動物的設備；也有每天看得到的智慧手錶和電動車。這些裝置透過感測器運作，可以偵測溫度、動作、位置及影像，並即時分享資料；多數情況不需要人為操作。", "這些裝置能直接造福人們。例如智慧家庭感測器可更有效率地控制設備，避免浪費能源；人出門時自動關閉暖氣或空調，返家前再開啟。物聯網也能協助尋車，或在冰箱牛奶不足時自動訂購。物聯網持續擴展，未來可能遍及各處；它可以監測作物成長幫助農民，也可減少能源消耗、保護環境。"], "page": 12}], "question": "Which IoT project would help our village the most?", "questionZh": "問題：哪一個物聯網計畫最能幫助村子？", "task": "Which IoT use would help your community the most: smart homes, smart farms, or health monitoring?", "intro": ["Thank you for coming! We have money for one IoT project. All three projects can help people."], "starters": ["In my opinion, ___ would help our community the most because …", "First, IoT devices can …", "For example, the reading says that …", "This means that …", "With the help of sensors, energy can be saved when …", "These devices keep …", "Some people may think that … However, …", "Therefore, I believe …"], "vocab": [["invent", "發明"], ["security", "安全"], ["communicate", "溝通"], ["network", "網路"], ["unique", "獨特的"], ["revolution", "重大變革"], ["online", "線上的"], ["device", "裝置"], ["monitor", "監測"], ["collectively", "總稱地"], ["sensor", "感測器"], ["efficiently", "有效率地"]], "options": [{"id": "home", "english": "Smart homes would help our village the most", "chinese": "智慧家庭"}, {"id": "farm", "english": "Smart farms would help our village the most", "chinese": "智慧農場"}, {"id": "health", "english": "Health monitoring would help our village the most", "chinese": "健康監測"}], "cards": [{"id": "E1", "en": "Smart home sensors turn the heating or air conditioning off when we leave, so energy isn’t wasted.", "zh": "智慧家庭感測器可以在我們外出時關閉暖氣或空調，避免浪費能源。", "source": "Reading 2", "relevance": {"home": "direct"}, "warrants": {"home": "Families waste less energy, so they can save money."}}, {"id": "E10", "en": "The doorbell camera owner can choose to get messages only when someone rings the bell.", "zh": "門鈴攝影機的擁有者可以設定只在有人按門鈴時收到訊息，因此使用者仍能控制裝置分享的內容。", "source": "Listening", "relevance": {}, "warrants": {}}, {"id": "E7", "en": "IoT devices share data in real time.", "zh": "物聯網裝置會即時分享資料。", "source": "Reading 2", "relevance": {"health": "direct", "home": "indirect", "farm": "indirect"}, "warrants": {"health": "Doctors learn about a heart problem quickly, so they can help sooner.", "home": "Families learn about a problem at home quickly.", "farm": "Farmers learn about a problem on the farm quickly."}}], "cardCount": 12, "questionsCount": 6, "miniCount": 0, "challenge": {"home": {"who": "tom", "line": "Wait! Most of the time, IoT devices share data without any input from people. Isn’t that a problem? Who is in control?", "opp": "Most of the time, IoT devices share data without any input from people.", "good": [{"need": "E10", "t": "The doorbell camera owner can choose to get messages only when someone rings the bell. So people can still choose what their devices share.", "reply": "Oh, I see. People can still choose. That makes me feel better."}], "weigh": "This benefit is important for every family, so I still think smart homes are a good idea.", "weighReply": "Hmm, OK. The benefit is big. I still want people to stay in control, but I understand your idea.", "weak": [{"t": "In a network with no central point, if one computer is taken out, the others can still communicate.", "why": "That is about a strong network. I’m asking about control. Does this answer me?"}, {"t": "Everybody uses smartphones these days.", "why": "That doesn’t answer my worry about control."}]}, "farm": {"who": "tom", "line": "Wait! Most of the time, IoT devices share data without any input from people. Isn’t that a problem? Who is in control?", "opp": "Most of the time, IoT devices share data without any input from people.", "good": [{"need": "E10", "t": "The doorbell camera owner can choose to get messages only when someone rings the bell. So people can still choose what their devices share.", "reply": "Oh, I see. People can still choose. That makes me feel better."}], "weigh": "This benefit is important for our farm, so I still think smart farms are a good idea.", "weighReply": "Hmm, OK. The benefit is big. I still want people to stay in control, but I understand your idea.", "weak": [{"t": "In a network with no central point, if one computer is taken out, the others can still communicate.", "why": "That is about a strong network. I’m asking about control. Does this answer me?"}, {"t": "Everybody uses smartphones these days.", "why": "That doesn’t answer my worry about control."}]}, "health": {"who": "tom", "line": "Wait! Most of the time, IoT devices share data without any input from people. Isn’t that a problem? Who is in control?", "opp": "Most of the time, IoT devices share data without any input from people.", "good": [{"need": "E10", "t": "The doorbell camera owner can choose to get messages only when someone rings the bell. So people can still choose what their devices share.", "reply": "Oh, I see. People can still choose. That makes me feel better."}], "weigh": "This can help people with heart problems, so the benefit is bigger than the worry.", "weighReply": "Hmm, OK. The benefit is big. I still want people to stay in control, but I understand your idea.", "weak": [{"t": "In a network with no central point, if one computer is taken out, the others can still communicate.", "why": "That is about a strong network. I’m asking about control. Does this answer me?"}, {"t": "Everybody uses smartphones these days.", "why": "That doesn’t answer my worry about control."}]}}, "qualifiers": null, "practice": true, "steps": [["情境與閱讀", "從原始 Reading 建立科技概念，進入村莊情境。"], ["知識探索", "與 NPC 互動並完成知識題、情境任務，形成判斷基礎。"], ["Claim 主張", "從可選立場中做出可討論的決定。"], ["Evidence 證據", "從材料卡選擇與主張相關的資訊；卡片可能有直接、間接或背景作用。"], ["Warrant 推理連結", "解釋資料為何能支持主張，而不只是複述資料。"], ["Counterargument 反方質疑", "聆聽對方提出的限制、風險或不同利益。"], ["Rebuttal 回應反方", "運用相關材料或合理的條件回應質疑。"], ["Argumentative Writing 獨立寫作", "利用探索成果整理理由、證據、反方觀點與回應，完成英文論證短文。"]]}, "3": {"meta": {"zh": "郵差村", "topic": "電子郵件與垃圾郵件", "purpose": "正式介入一", "extend": "將電子郵件歷史、@ 符號、垃圾郵件及網路釣魚知識轉化為郵件分類及村議會是否限制大量廣告郵件的政策討論。", "learning": "能辨認正常郵件與可疑郵件；區分垃圾郵件與合法行銷；蒐集證據討論禁令範圍及可能影響。", "taskzh": "寫一篇 120–150 字的英文論證短文，支持或反對禁止大量廣告電子郵件，引用相關證據、處理反方觀點，並說明適當限制條件。", "scene": "郵差村正面臨大量廣告郵件與安全疑慮，學生先協助分類郵件，再向議會提出政策建議。", "question": "郵差村是否應禁止大量廣告電子郵件？"}, "readings": [{"title": "A Brief History of Email", "english": ["The invention of electronic mail, or email, did not spring from an idea proposed by a single person. Instead, it was something that evolved1 over time. In the 1960s, for example, the earliest form of email was to leave a message in a file directory2 on a person’s computer. This wasn’t really sending email, though. It was more like the recipient3 finding a note left on a desk.\nIn 1972, the first real email was born. It was at this time that a computer programmer worked out a way to send a message from one computer to another. From there, many systems were developed that organized messages being sent and received. This was done using Simple Mail Transfer4 Protocol (SMTP). By the 1980s, personal computers were becoming popular and could be found in offices and homes. Within offices, people would often have computers connected together in a local area network (LAN). Instead of making phone calls or writing messages on paper, people within an office could now send each other messages quickly and easily.", "Over the next few decades, the use of the internet became widespread. Email services like Hotmail and Yahoo Mail popped up that allowed people and businesses to use email for free. People were no longer confined to sending emails only to those on the same LAN. Rather, email users could now send messages to anyone with an email address and an internet connection. In the early 2000s, features like attachments5, filters, and labels were introduced in email services. Today, popular email services from Google, Apple, and Microsoft are still adding new tools to make email a great communication choice for regular people and those in the business world.\nWhile other methods are available now, such as direct messaging or posting on social media websites, email is still a standard way of communicating. It will probably continue to change, but so far it has remained as one form of electronic communication that is indispensable6."], "chinese": ["電子郵件並非由某個人一次發明，而是逐步演變而來。1960 年代最早的形式，是在他人電腦的檔案目錄裡留下訊息；那其實還不算寄送郵件，更像是把紙條放在對方桌上。1972 年出現真正的電子郵件：程式設計師找到了讓訊息從一台電腦傳到另一台的方法。之後各種系統利用簡易郵件傳輸協定（SMTP）組織訊息的收發。1980 年代個人電腦進入辦公室與家庭，辦公室內的區域網路（LAN）讓同事能快速互傳訊息，不必打電話或寫紙條。", "隨著網際網路普及，Hotmail、Yahoo Mail 等免費服務出現。使用者不再只能寄給同一區域網路的人，而能寄給任何有信箱和網路連線的人。2000 年代初期，附件、篩選器與標籤等功能加入電子郵件；今日 Google、Apple、Microsoft 等服務仍持續改進相關工具。雖然現在有即時通訊和社群媒體，電子郵件仍是標準的溝通方式。它未來可能繼續改變，目前仍是不可或缺的電子通訊形式。"], "page": 26}, {"title": "The @ Symbol and the Birth of Spam", "english": ["Not very long ago, the “@” (at) symbol7 was not very commonly used. It became ubiquitous8 when, in 1971, a computer programmer, Ray Tomlinson, chose this symbol to indicate that a message was being sent from one computer to another. The symbol also makes sure that the message is sent to the correct email server. This simple choice quickly became the standard, and today all of our email addresses use this symbol.\nAs we all know, sending physical letters to large amounts of people can carry a huge cost. The cost of the paper, printing, and postage9 must all be considered against an estimated return, making direct mail marketing campaigns10 quite risky. As more and more people started using email, though, it didn’t take long for marketers11 to discover a hidden value in it. Sending a single email was virtually cost-free, and it was the same for sending millions of emails. This idea was the birth of what we know today as “spam.”", "Spam is unwanted email for advertisement or marketing purposes. It used to clog people’s inboxes in the early days of email. Spam marketers obtain huge lists of email addresses by scraping12 the internet. They can also use illegal methods to gain email addresses. The content of spam might contain hyperlinks to computer viruses, unwanted downloads, or even malware. Another commonly seen and dangerous form of spam today is phishing. These emails try to get recipients’ personal information so that criminals can profit from it.\nThankfully, though, with advanced technology, email servers are able to spot spam messages, and even route them to a spam folder for us. As a result, we no longer see so many spam messages and can quickly read the important and safe emails. Spam will probably be around for a long time, but now we have the tools to avoid the majority of it. However, we still have to be careful when we click open each email, even if it is regarded as “safe.”"], "chinese": ["不久以前，@ 符號並不常見。1971 年，程式設計師 Ray Tomlinson 選用它來表示訊息從一台電腦寄往另一台，也協助寄到正確的電子郵件伺服器。這個簡單決定很快成為標準，今日所有電子郵件地址都有這個符號。大量寄送實體信件需要紙張、印刷和郵資，成本高且行銷回報不確定。隨著電子郵件普及，行銷人員發現寄送一封或數百萬封電子郵件的成本都極低；這就是今日所稱垃圾郵件的起源。", "垃圾郵件是收件者不想要的廣告或行銷郵件，早期曾塞滿信箱。寄送者可能透過網路爬取或非法方法蒐集大量信箱地址。郵件可能包含病毒連結、不想要的下載程式或惡意軟體；另一種危險形式是網路釣魚，目的是騙取個人資訊供犯罪者牟利。幸好現代郵件伺服器能辨識垃圾郵件並移到垃圾郵件匣，讓我們更容易閱讀重要且安全的郵件。不過垃圾郵件仍可能長期存在，即使郵件被標為安全，點開時仍必須小心。"], "page": 28}], "question": "Should our village ban mass advertising emails?", "questionZh": "議題：郵差村是否應該禁止大量寄送廣告 email？", "task": "Should mass advertising emails be banned?", "intro": ["Thank you for coming. Remember: mass advertising emails are advertising emails sent to very many people at once. Some people want them, but many are unwanted spam.", "Here is the question for our council:"], "starters": ["I think mass advertising emails should / should not be banned because …", "As the reading says, …", "For example, spam can …", "This shows that …", "Email has become …", "As email is almost free, …", "Some people believe that … However, …", "In conclusion, …"], "vocab": [["evolve", "演變"], ["directory", "目錄"], ["recipient", "收件人"], ["transfer", "傳輸"], ["attachment", "附件"], ["indispensable", "不可或缺的"], ["symbol", "符號"], ["ubiquitous", "無所不在的"], ["postage", "郵資"], ["campaign", "（行銷）活動"], ["marketer", "行銷人員"], ["scrape", "擷取（網路資料）"]], "options": [{"id": "ban", "english": "Our village should ban mass advertising emails", "chinese": "禁止大量廣告郵件"}, {"id": "noban", "english": "Our village should not ban mass advertising emails", "chinese": "不全面禁止大量廣告郵件"}], "cards": [{"id": "E2", "en": "Spam marketers get email addresses by scraping the internet or by illegal methods.", "zh": "許多垃圾郵件行銷人員透過網路爬取或非法方式取得電子郵件地址。", "source": "Reading 2", "relevance": {"ban": "direct"}, "warrants": {"ban": "Some marketers get addresses in unfair or illegal ways, so a rule is needed."}}, {"id": "E3", "en": "Spam may contain links to viruses, unwanted downloads, or malware.", "zh": "垃圾郵件可能包含病毒、不想要的下載項目、惡意軟體或網路釣魚風險。", "source": "Reading 2", "relevance": {"ban": "direct"}, "warrants": {"ban": "Spam can harm people’s computers, so limiting it protects people."}}, {"id": "E11", "en": "We still have to be careful when we open each email, even one that seems safe.", "zh": "即使郵件系統可過濾大部分垃圾郵件，人們開信時仍必須小心。", "source": "Reading 2", "relevance": {"ban": "indirect"}, "warrants": {"ban": "Even with filters, some emails are still risky, so people are not fully protected."}}], "cardCount": 15, "questionsCount": 7, "miniCount": 6, "challenge": {"ban": {"who": "amanda", "line": "But email saves my shop a lot of money! And email servers already put most spam in a spam folder. Why ban it?", "opp": "Email saves shops money, and servers already put most spam in a spam folder.", "good": [{"need": "E11", "t": "Filters stop most spam, but we still have to be careful with every email. So filters alone may not be enough.", "reply": "Hmm. You’re right that filters are not perfect. I understand your idea."}, {"need": "E2", "t": "Many spam marketers get addresses by scraping or by illegal methods. A rule against those emails would not stop honest shops like yours.", "reply": "If the rule is only for those emails, my shop would be OK. That sounds fair."}], "weigh": "Protecting people is more important than saving money.", "weighReply": "I see. You think safety comes first. I don’t agree, but I understand your reason.", "weak": [{"t": "Paper letters need paper, printing, and postage.", "why": "Hmm, that helps my side! Paper letters cost more, so email is better for shops."}, {"t": "The first email was a note in a directory.", "why": "That’s history. It doesn’t answer my question about filters."}]}, "noban": {"who": "mei", "line": "But I almost lost my money to a phishing email! Spam is dangerous. Why not ban it?", "opp": "Phishing emails are dangerous, so spam should be banned.", "good": [{"need": "E7", "t": "Email servers can spot most spam and send it to a spam folder, so we see much less spam today. We can also learn to be careful with strange emails.", "reply": "Oh, so the server can catch most of it. That makes me feel a little better."}], "weigh": "Banning all advertising emails would hurt honest businesses.", "weighReply": "Well, I still worry, dear. But I understand your reason.", "weak": [{"t": "Phishing emails try to get people’s personal information.", "why": "Yes, dear, that’s exactly why I’m worried! That helps my side."}, {"t": "The @ symbol makes sure email goes to the right server.", "why": "That’s true, but it doesn’t answer my worry about phishing."}]}}, "qualifiers": {"ban": [{"t": "Ban all mass advertising emails.", "out": ["The council bans all mass advertising emails. Inboxes are cleaner, and fewer people get tricked.", "But small shops like Amanda’s lose a cheap way to reach their customers."]}, {"t": "Ban only advertising emails sent to addresses taken by scraping or illegal methods.", "out": ["The council bans advertising emails sent to addresses taken by scraping or illegal methods. Honest shops can still email their customers.", "But the council must check how each address was collected, and some spam will still arrive."]}], "noban": [{"t": "Don’t ban them, and keep using spam filters.", "out": ["The council doesn’t ban advertising emails. The mail server keeps moving most spam to the spam folder.", "Shops can still reach customers cheaply. But some spam still gets through, so people must stay careful."]}, {"t": "Don’t ban them, but teach people to be careful with every email.", "out": ["The council doesn’t ban advertising emails. Instead, the village teaches people how to spot phishing and strange links.", "Shops can still reach customers cheaply. But it takes time before everyone, like Grandma Mei, feels safe."]}]}, "practice": false, "steps": [["情境與閱讀", "從原始 Reading 建立科技概念，進入村莊情境。"], ["知識探索", "與 NPC 互動並完成知識題、情境任務，形成判斷基礎。"], ["Claim 主張", "從可選立場中做出可討論的決定。"], ["Evidence 證據", "從材料卡選擇與主張相關的資訊；卡片可能有直接、間接或背景作用。"], ["Warrant 推理連結", "解釋資料為何能支持主張，而不只是複述資料。"], ["Counterargument 反方質疑", "聆聽對方提出的限制、風險或不同利益。"], ["Rebuttal 回應反方", "運用相關材料或合理的條件回應質疑。"], ["Qualifier 限定條件", "在正式介入三單元中，依情境縮小或調整政策適用範圍。"], ["Argumentative Writing 獨立寫作", "利用探索成果整理理由、證據、反方觀點與回應，完成英文論證短文。"]]}, "5": {"meta": {"zh": "雲朵村", "topic": "雲端運算與協作", "purpose": "正式介入二", "extend": "將雲端儲存、SaaS、檔案同步、協作的概念轉化為企業顧問任務，評估工作全面上雲的益處及網路中斷風險。", "learning": "能區分雲端儲存與軟體服務；依使用需求提出建議；運用證據分析效率、成本與備份風險。", "taskzh": "寫一篇 120–150 字的英文論證短文，主張工作室是否應將全部檔案與工作移至雲端；以兩項理由及證據支持，回應疑慮並說明條件。", "scene": "天空設計工作室考慮將全部檔案與工作搬上雲端；學生幫不同訪客處理雲端需求，再向老闆提供決策建議。", "question": "天空設計工作室應否把所有檔案與工作移至雲端？"}, "readings": [{"title": "The Basics of Cloud Computing", "english": ["If you want to be able to access1 files or data from anywhere in the world, using cloud storage2 is the way to go. For businesses, this allows for fast and easy data sharing3, while making it easier for collaboration4 as well. In addition, companies don’t need to set up massive data centers on their own. Instead, they can get an account to use the storage equipment provided by companies that offer cloud storage. All of these things give a good example of what cloud storage can do. But what exactly is the cloud?\nThe most important aspect of the cloud is that there is no reason to own the services themselves. They are considered on-demand5, so the information can be accessed anywhere at any time, assuming there is an available internet connection. Take Netflix, the on-demand video streaming service, for example. Thousands of movies and TV shows are stored on the cloud and managed with cloud computing technology. Users with a paid Netflix account can watch any movies and TV shows without downloading them or purchasing DVDs.", "On a more personal level, the cloud is not just used for storage and synchronizing6 files. With a subscription7 fee, users can use a bundle of Adobe applications8 or Microsoft’s Office suite. This cloud service is called Software as a Service (SaaS). Users can enjoy this service to edit their photos, videos, and documents entirely on the cloud. In all these ways, cloud computing makes our digital life run smoothly and helps us get work done in a more efficient9 way."], "chinese": ["若想從世界任何地方存取檔案與資料，雲端儲存是個選擇。企業能快速分享資料、協同合作，也不必自行建立大型資料中心，而是使用雲端服務公司提供的設備。這些都是雲端儲存的用途，那麼雲端究竟是什麼？雲端的重要特徵是不需要自行擁有相關服務。這些服務可隨需使用；只要有網路連線，就能隨時隨地存取。以 Netflix 為例，大量影片存放並透過雲端技術管理，付費用戶無須下載影片或購買 DVD 就能觀看。", "對個人而言，雲端不只是儲存與同步檔案。付費訂閱後，使用者也能透過 Adobe 或 Microsoft Office 等應用程式組合工作；這種模式稱為軟體即服務（SaaS）。使用者可在雲端編輯照片、影片和文件，使數位生活和工作更有效率。"], "page": 48}, {"title": "Work Smart with the Cloud", "english": ["Our computers, whether they be laptops, tablets, or smartphones, perform many different functions10. The original model of how a computer worked always dealt with the storage of data and software. For most personal computers, storage was done locally on a hard drive.\nCloud storage removes the necessity for keeping all digital data locally. Once a user installs the cloud service application on their computer, they can set up the application to save and store files for them. Users can even access these files from any computer. In addition, users no longer need to purchase software programs on their own. The cloud service providers offer a wide range of applications that can be accessed and used on the cloud.", "Another function that cloud computing allows for is greater collaboration. Take Dropbox, one of the first cloud storage providers, for example. A document is stored securely in the Dropbox folder. If the document owner shared it with multiple11 users, they could access and work on it without having to email it back and forth. The cloud synchronizes all the users’ comments12 onto the document, so users can feel assured that their work will not be lost. There are still other functions that a cloud offers. With Dropbox, users can record screens, save passwords, and send documents for signatures.", "Other clouds, such as Google Workspace and Microsoft 365, offer a slightly different service. They developed a whole set of cloud software for users to handle their documents in offices. During the Covid pandemic, these tech giants also offered video conferencing applications for users to stay connected. All these cloud services let people work more easily from home.\nIn the past, we could only handle documents in the office. With cloud services, we can work anywhere we want and know that efficiency will not suffer."], "chinese": ["筆電、平板和手機具有許多功能。過去電腦的資料與軟體大多存在本機，個人電腦通常使用硬碟存放資料。雲端儲存減少了必須將所有資料存在本機的需求。安裝雲端應用程式後，使用者可設定檔案儲存及同步，甚至從其他電腦存取；也不一定要自行購買每套軟體，而可以使用雲端服務提供的各種應用。", "雲端還能促進協作。以早期雲端儲存業者 Dropbox 為例，文件可安全存放在資料夾中，分享給多人後就能共同存取和編輯，不必反覆寄送電子郵件附件。雲端會同步各人的註解，降低成果遺失的疑慮。Dropbox 也提供螢幕錄製、密碼保存與文件簽署等功能。Google Workspace 和 Microsoft 365 等服務則提供一整套辦公用雲端軟體。新冠疫情期間，這些科技公司也提供視訊會議服務，讓使用者保持聯繫；雲端因此有助於居家工作。過去很多文件只能在辦公室處理，使用雲端服務後，人們能在不同地點工作，仍維持效率。"], "page": 50}], "question": "Should Sky Studio move all of its files and work to the cloud?", "questionZh": "問題：天空設計工作室是否應該把所有檔案和工作都移到雲端？", "task": "Should a small company move all of its files and work to the cloud?", "intro": ["Thank you for coming. Here is my big question:"], "starters": ["I think the company should / should not move all of its work to the cloud because …", "First, if the company uses the cloud, …", "For example, the reading says that …", "This means that workers …", "In addition, cloud storage allows …", "If the company built its own data center, …", "Some people may worry that … However, …", "For these reasons, …"], "vocab": [["access", "存取；使用"], ["storage", "儲存（空間）"], ["share", "分享"], ["collaboration", "協作"], ["on-demand", "隨選的"], ["synchronize", "同步"], ["subscription", "訂閱"], ["application", "應用程式"], ["efficient", "有效率的"], ["function", "功能"], ["multiple", "多個的"], ["comment", "意見；註解"]], "options": [{"id": "move", "english": "Sky Studio should move all of its files and work to the cloud", "chinese": "所有工作都移到雲端"}, {"id": "keep", "english": "Sky Studio should not move all of its files and work to the cloud", "chinese": "不將所有工作移到雲端"}], "cards": [{"id": "E1", "en": "You can access files from anywhere in the world, at any time, if there is an internet connection.", "zh": "只要有網際網路連線，就能在世界各地隨時存取檔案。", "source": "Reading 1", "relevance": {"move": "direct"}, "warrants": {"move": "Workers can open their files wherever they are."}}, {"id": "E7", "en": "Cloud services helped people work from home during the Covid pandemic.", "zh": "新冠疫情期間，雲端服務協助人們在家工作。", "source": "Reading 2", "relevance": {"move": "indirect"}, "warrants": {"move": "Cloud tools let people work from different places."}}, {"id": "E12", "en": "Dropbox was one of the first cloud storage providers.", "zh": "Dropbox 是早期的雲端儲存服務提供者之一。", "source": "Reading 2", "relevance": {}, "warrants": {}}], "cardCount": 13, "questionsCount": 6, "miniCount": 6, "challenge": {"move": {"who": "hao", "line": "But what if the internet stops working? Up here at the farm, it often does! Then nobody could open any files.", "opp": "The cloud needs an internet connection. If the internet stops, nobody can open the files.", "good": [{"need": null, "t": "That’s true. The cloud needs an internet connection, so the company should check that its connection is reliable before it moves its work.", "reply": "Checking the connection first. That’s a careful idea. I feel better now."}], "weigh": "Most of the time, the benefits are bigger than this problem.", "weighReply": "Well, the internet is good in the village most days. I understand your idea.", "weak": [{"t": "Netflix users can watch movies without buying DVDs.", "why": "Movies? That doesn’t answer my question about the internet!"}, {"t": "Dropbox was one of the first cloud storage providers.", "why": "That’s history. It doesn’t help when the internet stops."}]}, "keep": {"who": "ben", "line": "But with the cloud, workers can open files anywhere, and the team can work on one document together! Why not move everything?", "opp": "With the cloud, workers can open files anywhere, and the team can work on one document together.", "good": [{"need": "E8", "t": "Cloud files can only be opened if there is an internet connection. Without it, workers can’t do any work.", "reply": "True. My internet is good, but not everyone’s is. I see your point."}], "weigh": "Moving everything is too risky for a small company.", "weighReply": "I still love the cloud. But I understand why you want to be careful.", "weak": [{"t": "You can access files from anywhere in the world.", "why": "Exactly! That helps my side, not yours."}, {"t": "Netflix users can watch movies without buying DVDs.", "why": "That’s about movies, not about the company’s work."}]}}, "qualifiers": {"move": [{"t": "Move all files and work to the cloud, with no copies on the office computers.", "out": ["Sky Studio moves all of its files and work to the cloud. Workers share documents and work from anywhere.", "But on days when the internet stops, nobody can open any files, and the company pays a subscription fee every month."]}, {"t": "Move the main work to the cloud, but keep a backup of important files on the company’s own computers.", "out": ["Sky Studio moves its main work to the cloud and keeps a backup of important files on its own computers.", "Workers can share documents easily. On days without internet, they can still open the backup files, but someone must keep the backup up to date."]}], "keep": [{"t": "Keep most work on office computers, and use the cloud only for sharing documents.", "out": ["Sky Studio keeps most of its work on office computers and uses the cloud only to share documents.", "Work doesn’t stop when the internet is down. But some workers still email files back and forth, and changes are sometimes lost."]}, {"t": "Don’t move now. Move later when the internet connection is better.", "out": ["Sky Studio waits. It will move to the cloud after the internet connection gets better.", "For now, work doesn’t depend on the internet. But the team still emails files back and forth, and the company must check the connection again later."]}]}, "practice": false, "steps": [["情境與閱讀", "從原始 Reading 建立科技概念，進入村莊情境。"], ["知識探索", "與 NPC 互動並完成知識題、情境任務，形成判斷基礎。"], ["Claim 主張", "從可選立場中做出可討論的決定。"], ["Evidence 證據", "從材料卡選擇與主張相關的資訊；卡片可能有直接、間接或背景作用。"], ["Warrant 推理連結", "解釋資料為何能支持主張，而不只是複述資料。"], ["Counterargument 反方質疑", "聆聽對方提出的限制、風險或不同利益。"], ["Rebuttal 回應反方", "運用相關材料或合理的條件回應質疑。"], ["Qualifier 限定條件", "在正式介入三單元中，依情境縮小或調整政策適用範圍。"], ["Argumentative Writing 獨立寫作", "利用探索成果整理理由、證據、反方觀點與回應，完成英文論證短文。"]]}, "6": {"meta": {"zh": "機器人村", "topic": "人工智慧發展與生成式 AI", "purpose": "正式介入三", "extend": "將 AI 歷史、生成式 AI 的能力與可信度議題轉化為 AI 回應查核與學校是否允許 AI 輔助英文寫作的規範討論。", "learning": "能辨認 AI 的用途與局限；區分發想協助與直接代寫；以證據討論 AI 的教育價值、風險及使用規則。", "taskzh": "寫一篇 120–150 字的英文論證短文，主張學生是否應使用 BitBot 類 AI 工具協助英文寫作；提供證據、說明推理、回應疑慮並提出使用條件。", "scene": "校方考慮訂定 AI 英文寫作使用規範；學生分析 AI 回應的可信度，向校長提出有條件的建議。", "question": "學生應否使用 BitBot 等 AI 工具協助英文寫作？"}, "readings": [{"title": "Looking Back on AI", "english": ["Artificial intelligence was once nothing more than an idea written about in science fiction novels. In these stories, robots1 with human-level intelligence (or greater) existed side by side with human beings, often helping with day-to-day tasks. As these ideas developed, actual scientists and mathematicians2 explored whether true artificial intelligence was even possible. In 1950, the brilliant scientist and mathematician Alan Turing even wrote a paper that discussed how intelligent machines could be built. In the paper, he introduced a test, later known as the Turing Test, to test a machine’s intelligence.", "While the concept of AI was intriguing3 to a lot of people in the computer science field, it was a difficult area to work in, at least in the past. In the 1950s and 60s, computers were much slower than they are today and did not have the massive data storage that we take for granted now. Because processing speed and vast quantities of data were needed to even test out4 AI theories, the limited computing power made it very difficult to do. In addition, just using the existing computers of the time cost an enormous amount of money. Therefore, for many decades, progress in the field of AI came slowly.", "By the 1980s, though, the concept5 of a “neural6 network” was not strange to computer scientists. This allowed computers to learn from experience. Coupled with major advances in processing speed and data storage, along with drastic7 increases  in internet speed, AI could achieve deep learning along with other major advances.\nFast forward to today, we are just at the beginning of collecting the rewards for all of the past work done on AI. Where it will lead is anyone’s guess."], "chinese": ["人工智慧曾經只是科幻小說中的構想：具有與人類相當甚至更高智能的機器人與人類共同生活，協助日常工作。後來科學家與數學家開始研究真正的人工智慧是否可能。1950 年，Alan Turing 發表論文探討如何建造智能機器，並提出日後稱為圖靈測試的機器智能測驗。", "儘管許多電腦科學家對 AI 很感興趣，過去的研究條件卻十分困難。1950 至 1960 年代電腦速度慢、儲存量有限，而測試 AI 理論需要快速運算及大量資料，設備也極為昂貴，因此 AI 的進展在數十年間十分緩慢。", "到了 1980 年代，神經網路的概念已為電腦科學家熟知，使電腦得以從經驗學習。隨著運算速度、資料儲存和網路速度大幅提升，AI 得以發展深度學習等重要技術。時至今日，我們才剛開始享受過去 AI 研究累積的成果；未來會發展到哪裡仍很難預測。"], "page": 56}, {"title": "Current Development of AI", "english": ["In 2023, artificial intelligence made a major debut on the world stage. For most people, it was something they thought was always being worked on, yet never really produced any notable results. With systems such as Chat GPT and Dall E-3, though, it seemed like the world had changed overnight. Chat GPT could mimic8 conversations, write articles, and do all sorts of things that most believed only humans were capable of achieving. Dall E-3 took prompts9 from users and created images that looked like real photographs or hand-painted art. The level of sophistication10 and ability stunned a lot of people.", "Companies and individuals now have AI tools at their disposal. A majority of companies plan to use or are already using AI for sales and marketing. What they use is called generative11 AI, in which AI is used to produce different forms of content, especially text, graphics, and audio or video files. Individuals, on the other hand, can use AI to help with all sorts of tasks. Probably the most useful is being able to ask AI to help you brainstorm ideas. For example, ask AI to plan a travel itinerary to Paris for you. The result will give you a rough idea about where to visit, what to do, and where to eat in Paris.\nOf course, with such powerful tools at everyone’s disposal, some fear that much of the content they read is just computer generated and not truly trustworthy12. While this may be true, there is no stopping AI now that companies have released it in the world."], "chinese": ["2023 年，人工智慧大幅進入大眾視野。過去許多人以為 AI 一直有人研究，卻沒有明顯成果；ChatGPT 和 DALL·E 3 的出現彷彿讓世界一夕改變。ChatGPT 能模擬對話、撰寫文章並執行過去被認為只有人類能做的工作；DALL·E 3 則能依照文字提示產生逼真的照片風格或手繪風格圖像，令人驚訝。", "企業和個人如今都能使用 AI 工具。許多企業計畫或已經將生成式 AI 用在銷售和行銷，產出文字、圖片、音訊或影片。個人則能用 AI 協助許多任務，尤其是發想點子；例如要求 AI 規劃巴黎旅行，就能得到景點、活動與餐飲的初步建議。當這些強大的工具人人可用，有人擔心閱讀到的內容可能由電腦生成而不夠可信。儘管有此疑慮，AI 已廣泛推出，發展趨勢難以逆轉。"], "page": 58}], "question": "Should our students use AI tools like BitBot to help with their English writing?", "questionZh": "問題：學生是否應該使用 BitBot 這類 AI 工具協助英文寫作？", "task": "Should students use AI tools like ChatGPT to help with their English writing?", "intro": ["Thank you for coming. Here is my question:"], "starters": ["I believe students should / should not use AI tools for English writing because …", "First, AI can …", "For example, the reading says that …", "This means that students …", "AI answers are not always …", "Starting with AI ideas is easier than …, but …", "Some people may say that … However, …", "In conclusion, students should …"], "vocab": [["robot", "機器人"], ["mathematician", "數學家"], ["intriguing", "引人入勝的"], ["test out", "測試"], ["concept", "概念"], ["neural", "神經的"], ["drastic", "劇烈的；極端的"], ["mimic", "模仿"], ["prompt", "提示指令"], ["sophistication", "精密；成熟度"], ["generative", "生成的"], ["trustworthy", "值得信賴的"]], "options": [{"id": "use", "english": "Students should be allowed to use AI tools to help with English writing", "chinese": "允許學生用 AI 輔助英文寫作"}, {"id": "notuse", "english": "Students should not use AI tools for English writing", "chinese": "不允許學生用 AI 輔助英文寫作"}], "cards": [{"id": "E1", "en": "ChatGPT can mimic conversations and write articles.", "zh": "ChatGPT 可以模擬對話與撰寫文章。", "source": "Reading 2", "relevance": {"use": "indirect", "notuse": "indirect"}, "warrants": {"use": "AI can show students example sentences and ideas.", "notuse": "Students could hand in AI writing instead of their own."}}, {"id": "E4", "en": "Luke uses ChatGPT’s thank-you note to get ideas, then writes his own.", "zh": "Luke 使用 ChatGPT 產生的感謝信獲取想法，再自己撰寫。", "source": "Listening", "relevance": {"use": "direct"}, "warrants": {"use": "Students can use AI ideas and still write their own work."}}, {"id": "E5", "en": "AI answers are not always trustworthy.", "zh": "AI 產生的內容可能不完全可靠，因此必須查證。", "source": "Listening", "relevance": {"notuse": "direct"}, "warrants": {"notuse": "Students may learn wrong information from AI."}}], "cardCount": 13, "questionsCount": 7, "miniCount": 6, "challenge": {"use": {"who": "nina", "line": "But AI answers are not always trustworthy! And students might just copy them. Why let them use AI?", "opp": "AI answers are not always trustworthy, and students might just copy them.", "good": [{"need": "E4", "t": "Students can use AI only for ideas and then write their own work, like Luke does with his thank-you notes. That answers the copying problem.", "reply": "Using AI only for ideas, then writing it yourself. That sounds better."}, {"need": "E5", "t": "That’s why students must check every AI answer against what they read before they use it. That answers the trust problem.", "reply": "Checking every answer is important. I feel a little better."}], "weigh": "Students just need to check the answers and write in their own words.", "weighReply": "Checking carefully is important. I still worry a little, but I understand your idea.", "weak": [{"t": "Alan Turing wrote about intelligent machines in 1950.", "why": "That’s history. It doesn’t answer my worry about copying."}, {"t": "In the 1950s and 60s, computers were slow and expensive.", "why": "That was a long time ago. It doesn’t answer my question."}]}, "notuse": {"who": "max", "line": "But there is no stopping AI now! Companies already use it. Shouldn’t students learn to use it, too?", "opp": "There is no stopping AI, and companies use it, so students should learn to use it.", "good": [{"need": "E5", "t": "AI answers are not always trustworthy, so students must first learn to write and check ideas on their own.", "reply": "OK, that’s fair. You need to know when AI is wrong. I see your point."}], "weigh": "Learning to write by ourselves comes first.", "weighReply": "I still think AI is useful. But I understand why you want students to learn on their own first.", "weak": [{"t": "Most companies use or plan to use AI for sales and marketing.", "why": "Exactly! That helps my side, not yours."}, {"t": "Neural networks allow computers to learn from experience.", "why": "Interesting, but it doesn’t answer my question about students."}]}}, "qualifiers": {"use": [{"t": "Students can use AI only for brainstorming ideas.", "out": ["The school lets students use BitBot only to brainstorm ideas. Students write every sentence themselves.", "Students get started faster. But teachers must check that the writing is really the students’ own."]}, {"t": "Students can use AI, but they must check every answer and write their own work.", "out": ["The school lets students use BitBot if they check every answer and write their own work.", "Students learn to use AI carefully. But checking answers takes time, and some AI answers are still wrong."]}], "notuse": [{"t": "Students should not use AI at all for English writing.", "out": ["The school does not allow BitBot for English writing at all. Students practice thinking and writing on their own.", "But some students feel they are missing a useful tool that many companies already use."]}, {"t": "Students should not use AI until they can write well on their own.", "out": ["For now, the school does not allow BitBot for English writing. Students first practice writing on their own.", "Later, when students can write well, the school will talk about allowing AI again. Some students want to start sooner."]}]}, "practice": false, "steps": [["情境與閱讀", "從原始 Reading 建立科技概念，進入村莊情境。"], ["知識探索", "與 NPC 互動並完成知識題、情境任務，形成判斷基礎。"], ["Claim 主張", "從可選立場中做出可討論的決定。"], ["Evidence 證據", "從材料卡選擇與主張相關的資訊；卡片可能有直接、間接或背景作用。"], ["Warrant 推理連結", "解釋資料為何能支持主張，而不只是複述資料。"], ["Counterargument 反方質疑", "聆聽對方提出的限制、風險或不同利益。"], ["Rebuttal 回應反方", "運用相關材料或合理的條件回應質疑。"], ["Qualifier 限定條件", "在正式介入三單元中，依情境縮小或調整政策適用範圍。"], ["Argumentative Writing 獨立寫作", "利用探索成果整理理由、證據、反方觀點與回應，完成英文論證短文。"]]}}</script><script>
const D=JSON.parse(document.getElementById('data').textContent);let unit='1',tab='overview',mode='hide';const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const $=id=>document.getElementById(id);
function B(en,zh,label='英文原文'){return `<div class="english"><div class="label">${esc(label)}</div><div class="orig">${esc(en)}</div></div><div class="trans" ${mode==='hide'?'hidden':''}><div class="label">繁體中文對照</div>${esc(zh)}</div>`}
function cardSection(u){return `<section class="panel"><h3>代表性 Evidence Cards｜證據卡</h3><p class="compact">本頁精選每單元 3 張卡協助快速審查；完整材料卡分別有 ${u.cardCount} 張，詳見既有附件五。卡片代碼與英文保留自 V2.2，中文由研究者製作為審查對照。</p>${u.cards.map(c=>`<div class="item"><span class="pill">${c.id}</span><span class="pill tag">來源：${esc(c.source)}</span>${B(c.en,c.zh)}<p class="compact">遊戲預設證據分類（待專家檢核）：${esc(JSON.stringify(c.relevance))}</p></div>`).join('')}</section>`}
function render(){const u=D[unit],m=u.meta; $('units').innerHTML=`<div class="label">選擇審查單元</div>`+Object.keys(D).map(x=>`<button class="${unit===x?'active':''}" onclick="unit='${x}';tab='overview';render()">Unit ${x}｜${D[x].meta.zh}<div class="compact">${D[x].meta.purpose}</div></button>`).join('');let H=`<section class="hero"><div class="label">Unit ${unit} · ${m.purpose}</div><h2>${m.zh}｜${m.topic}</h2><p>${m.scene}</p><p class="subtitle">審查以本手冊所載教學設計、課文、論證材料與寫作任務為依據；遊戲尚未公開部署。</p><div class="toolbar"><span class="subtitle">原文保留英文；中文可按需展開。</span><div class="switch"><button class="${mode==='hide'?'on':''}" onclick="mode='hide';render()">隱藏中文</button><button class="${mode==='show'?'on':''}" onclick="mode='show';render()">顯示全部中文</button></div></div></section><nav class="tabs">`+[['overview','單元概覽'],['readings','雙語課文'],['game','遊戲轉化'],['toulmin','Toulmin 模式'],['writing','英文寫作'],['review','審查重點']].map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')+'</nav>';
if(tab==='overview')H+=`<section class="panel"><h3>本單元設計總覽</h3><div class="two"><div class="tile"><b>原始教材</b><p>Reading 1：${esc(u.readings[0].title)}<br>Reading 2：${esc(u.readings[1].title)}</p></div><div class="tile"><b>預期學習成果</b><p>${m.learning}</p></div></div><h4>核心教學路徑</h4><div class="flow">${u.steps.filter((x,i)=>i<3||i>4).map(x=>`<span>${x[0]}</span>`).join('<span>→</span>')}</div><h4>遊戲核心議題</h4>${B(u.question,u.questionZh,'V2.2 主要提問')}</section>`;
if(tab==='readings')H+=u.readings.map((r,i)=>`<section class="panel"><h3>Reading ${i+1}｜${esc(r.title)}</h3><p class="compact">All Things Tech 1｜教材第 ${r.page} 頁。原課文完整轉錄，保留原有字詞標註數字及可能的原始排版文字；中文為方便審查之譯文。</p>${B(r.english.join('\n\n'),r.chinese.join('\n\n'),'Original Reading（全文）')}</section>`).join('');
if(tab==='game')H+=`<section class="panel"><h3>教材轉化為遊戲</h3><div class="hint"><b>轉化及延伸：</b>${m.extend}</div><h4>代表性學習活動</h4><div class="two"><div class="tile"><b>閱讀與主題知識</b><p>${m.topic}</p><span class="count">主要角色知識題：${u.questionsCount} 題</span></div><div class="tile"><b>情境應用活動</b><p>${({1:'網路修復與連線測試',3:'電子郵件辨識與分類',5:'依訪客需求提供雲端建議',6:'AI 回答的判讀與查核'})[unit]}</p><span class="count">${u.miniCount?u.miniCount+' 個情境項目':'另含互動修復活動'}</span></div></div><h4>英文字彙與中文釋義</h4><div class="two">${u.vocab.map(v=>`<div class="tile"><b>${esc(v[0])}</b><div class="compact">${esc(v[1])}</div></div>`).join('')}</div><p class="compact">此頁說明整體活動性質；完整 NPC 文字與知識題保留在既有附件三、四，供發現問題時深入查閱。</p></section>`;
if(tab==='toulmin')H+=`<section class="panel"><h3>Toulmin 論證教學流程</h3><p class="compact">以下為研究者依 V2.2 遊戲步驟整理的教學設計說明，不是宣稱所有 Toulmin 元素已在學生寫作中形成。</p>${u.steps.map((x,i)=>`<div class="item"><b>${i+1}. ${x[0]}</b><div>${x[1]}</div></div>`).join('')}<h4>Claim 主張選項（原始英文＋中文）</h4>${u.options.map(o=>B(o.english,o.chinese)).join('')}<p class="compact">注意：Unit 1 試玩版沒有獨立 Qualifier 步驟；Unit 3、5、6 則在選擇與回應後進一步處理政策或使用條件。</p></section>`+cardSection(u)+`<section class="panel"><h3>反方觀點與限定條件的實作</h3><div class="hint">反方質疑與反駁回應依所選 Claim／Evidence 可能不同。完整英文分支詳見附件五；本頁以中文呈現檢核方向，不以摘要代替逐一審查。</div><p><b>Counterargument：</b>遊戲透過 NPC 提出反方風險或不同利益，要求學生判斷主張的限制。</p><p><b>Rebuttal：</b>透過已蒐集的證據及對應的推理，回應該質疑；部分回饋會依選卡變動。</p><p><b>Qualifier：</b>${unit==='1'?'試玩單元未獨立設置。':'正式單元提供政策範圍或條件的選擇，避免無條件、過度概括的主張。'}</p></section>`;
if(tab==='writing')H+=`<section class="panel"><h3>獨立英文論證寫作任務</h3>${B(u.task,m.taskzh,'V2.2 Writing Task 題目')}<h4>題目與遊戲設計的連結</h4><p>遊戲結束前，學生已接觸該議題的科技知識、可選立場與部分支持或反對材料，再進入個別英文論證寫作。專家可檢核題目是否具可爭論性、是否超出原教材主題、以及 120–150 字的要求是否合理。</p><div class="hint">研究規劃之寫作要求：清楚主張、至少兩項理由及相關證據、推理說明、反方觀點與回應。完整平台或紙本寫作任務若另有版本，正式評估仍以實際提供給學生的定稿為準。</div><p class="compact">V2.2 還包含 ${u.starters.length} 個英語句型起始提示。為避免翻譯誤導句型用途，這裡先呈現功能與數量，逐句原文仍可參考附件六。</p></section>`;
if(tab==='review')H+=`<section class="panel"><h3>本單元的專家審查焦點</h3><div class="two"><div class="tile"><b>ESP 英語教學專家</b><p>① 兩篇閱讀的核心概念是否忠實轉化？<br>② 遊戲延伸的科技資訊是否清楚、準確？<br>③ A2–B1 學生能否理解語言與任務？<br>④ 英文作文題是否是可辯論的主張，且符合課文與遊戲？</p></div><div class="tile"><b>數位學習暨 Toulmin 專家</b><p>① 知識活動與最終決策是否自然銜接？<br>② 主張、證據與推理是否有效連結？<br>③ 是否真正要求學生考量反方與回應？<br>④ 遊戲中的選擇與回饋能否支持學生獨立寫作？</p></div></div><p class="compact">正式評分及簽名仍請使用各自的紙本審查表。本手冊是共同審查內容，不取代審查表。</p></section>`;
$('main').innerHTML=H;
}
render();</script></body></html>
